<mat-toolbar color="primary" class="header">
  <!-- โลโก้ -->
  <div class="logo" routerLink="/">
    <img src="assets/logob.png" alt="Dress Logo" class="logo-img" />
  </div>

  <!-- เมนูหลัก -->
  <nav class="nav-links">
    <a mat-button routerLink="/">หน้าหลัก</a>
    <a mat-button [routerLink]="(isLoggedIn$ | async) ? '/clothing-m' : '/clothing'">
      รายการชุด
    </a>
    <a mat-button [routerLink]="(isLoggedIn$ | async) ? '/accessories-m' : '/accessories'">
      Accessories
    </a>
    <a mat-button (click)="scrollToFooter()">เกี่ยวกับเรา</a>
  </nav>

  <!-- กล่องค้นหา + ปุ่ม -->
  <div class="actions">
    <form class="search-box" (ngSubmit)="searchProducts()">
      <input
        type="text"
        name="searchKeyword"
        placeholder="ค้นหา..."
        [(ngModel)]="searchKeyword" />
      <button type="submit" aria-label="ค้นหาสินค้า">
        <mat-icon>search</mat-icon>
      </button>
    </form>

    <!-- 🔹 ยังไม่ล็อกอิน -->
    <ng-container *ngIf="!(isLoggedIn$ | async); else loggedInIcons">
      <button
        mat-raised-button
        color="accent"
        class="login-btn"
        (click)="openLoginDialog()">
        เข้าสู่ระบบ <i class="fas fa-sign-in-alt"></i>
      </button>
    </ng-container>

    <!-- 🔹 ล็อกอินแล้ว -->
    <!-- ช่วงไอคอนตอนล็อกอิน -->
    <ng-template #loggedInIcons>
      <button mat-icon-button class="icon-btn" aria-label="Cart" routerLink="/cart">
        <mat-icon>shopping_cart</mat-icon>
      </button>
      <button mat-icon-button class="icon-btn" aria-label="Order status" routerLink="/order-status">
        <mat-icon>receipt_long</mat-icon>
      </button>
      <button mat-icon-button class="icon-btn" aria-label="Profile" (click)="openProfile()">
        <mat-icon>account_circle</mat-icon>
      </button>
      <button mat-icon-button class="icon-btn" aria-label="Categories" (click)="openCategories()">
        <mat-icon>list</mat-icon>
      </button>
    </ng-template>

  </div>

  <button
    mat-icon-button
    type="button"
    class="menu-icon"
    aria-label="เปิดเมนู"
    (click)="toggleMenu()">
    <mat-icon>{{ isMenuOpen ? 'close' : 'menu' }}</mat-icon>
  </button>
</mat-toolbar>

<!-- เมนูสำหรับมือถือ -->
<div class="mobile-menu" *ngIf="isMenuOpen">
  <form class="mobile-search-box" (ngSubmit)="searchProducts()">
    <input
      type="text"
      name="mobileSearchKeyword"
      placeholder="ค้นหา..."
      [(ngModel)]="searchKeyword" />
    <button type="submit">ค้นหา</button>
  </form>

  <a routerLink="/" (click)="isMenuOpen = false">หน้าหลัก</a>
  <a [routerLink]="(isLoggedIn$ | async) ? '/clothing-m' : '/clothing'" (click)="isMenuOpen = false">รายการชุด</a>
  <a [routerLink]="(isLoggedIn$ | async) ? '/accessories-m' : '/accessories'" (click)="isMenuOpen = false">Accessories</a>
  <a (click)="scrollToFooter()">เกี่ยวกับเรา</a>

  <ng-container *ngIf="!(isLoggedIn$ | async); else loggedMobile">
    <a (click)="openLoginDialog()">เข้าสู่ระบบ</a>
  </ng-container>
  <ng-template #loggedMobile>
    <a routerLink="/cart" (click)="isMenuOpen = false">ตะกร้าสินค้า</a>
    <a routerLink="/order-status" (click)="isMenuOpen = false">สถานะรายการ</a>
    <a (click)="openProfile()">โปรไฟล์</a>
    <a (click)="openCategories()">หมวดหมู่</a>
    <a (click)="logout()">ออกจากระบบ</a>
  </ng-template>
</div>
