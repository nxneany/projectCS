<header class="topbar">
  <div>
    <p>การเงิน</p>
    <h1>ช่องทางชำระเงิน</h1>
  </div>
</header>
<section class="panel">
  <div class="panel-heading">
    <h2>แก้ไข ค้นหาช่องทางชำระเงิน</h2>
    <button>บันทึก</button>
  </div>
  <div class="payment-editor">
    <label>ชื่อบัญชีธนาคาร<input [(ngModel)]="payment.accountName" /></label>
    <label>เลขบัญชี<input [(ngModel)]="payment.accountNumber" /></label>
    <label>พร้อมเพย์<input [(ngModel)]="payment.promptPay" /></label>
    <div class="qr-admin">
      <img [src]="payment.qrCode" alt="QR payment" /><button>
        เปลี่ยนรูป QR Code
      </button>
    </div>
  </div>
</section>
