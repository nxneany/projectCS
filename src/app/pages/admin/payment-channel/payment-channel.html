<header class="topbar">
  <div>
    <p>การเงิน</p>
    <h1>ช่องทางชำระเงิน</h1>
  </div>
</header>
<section class="panel">
  <div class="panel-heading">
    <h2>แก้ไข ช่องทางชำระเงิน</h2>
    <button type="button" (click)="savePaymentChannel()" [disabled]="saving">
      {{ saving ? 'กำลังบันทึก...' : 'บันทึก' }}
    </button>
  </div>
  <p class="status-text" *ngIf="loading">กำลังโหลดข้อมูล...</p>
  <p class="status-text error" *ngIf="errorMessage">{{ errorMessage }}</p>
  <p class="status-text success" *ngIf="successMessage">{{ successMessage }}</p>
  <div class="payment-editor">
    <label>ชื่อบัญชีธนาคาร<input [(ngModel)]="payment.accountName" /></label>
    <label>
      เลขบัญชี
      <input
        type="tel"
        inputmode="numeric"
        maxlength="13"
        placeholder="678-3-31492-8"
        [class.input-error]="accountNumberHasInvalidInput"
        [(ngModel)]="payment.accountNumber"
        (ngModelChange)="onAccountNumberInput($event)"
      />
      <small [class.error-hint]="accountNumberHasInvalidInput">
        {{ accountNumberHasInvalidInput ? 'เลขบัญชีกรอกได้เฉพาะตัวเลขเท่านั้น' : 'กรอกตัวเลข ระบบจะใส่ขีดให้อัตโนมัติ' }}
      </small>
    </label>
    <label>
      พร้อมเพย์
      <input
        type="tel"
        inputmode="numeric"
        pattern="[0-9]*"
        maxlength="13"
        placeholder="0971939481"
        [class.input-error]="promptPayHasInvalidInput"
        [(ngModel)]="payment.promptPay"
        (ngModelChange)="onPromptPayInput($event)"
      />
      <small [class.error-hint]="promptPayHasInvalidInput">
        {{ promptPayHasInvalidInput ? 'พร้อมเพย์กรอกได้เฉพาะตัวเลขเท่านั้น' : 'กรอกเฉพาะตัวเลข ไม่ต้องใส่ขีด' }}
      </small>
    </label>
    <div class="qr-admin">
      <img *ngIf="payment.qrCode" [src]="payment.qrCode" alt="QR payment" />
      <label class="qr-upload">
        <input type="file" accept="image/*" (change)="onQrSelected($event)" />
        เปลี่ยนรูป QR Code
      </label>
    </div>
  </div>
</section>
